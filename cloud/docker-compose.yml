# Cloud side: MQTT broker + cloud service, everything the VM runs.
# On a new VM: copy this folder, create mosquitto/passwd and .env (see
# cloud/README.md), then `docker compose up -d`.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data

  cloud:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on: [mosquitto]
    working_dir: /app
    volumes:
      - ./:/app:ro
      - cloud-state:/state            # twin + 24 h buffers survive restarts
    env_file: .env
    # service.py: baseline + digital twin (fake_cloud.py was the echo stand-in)
    command: ["sh", "-c", "pip install --quiet 'paho-mqtt>=2.0' numpy && python -u service.py --host mosquitto --state /state $${NODES_FILE:+--nodes $$NODES_FILE}"]

  telegram:
    image: python:3.12-slim
    container_name: sagriot-telegram
    restart: unless-stopped
    depends_on:
      - mosquitto
      - cloud
    working_dir: /app
    volumes:
      - ./:/app:ro
      - cloud-state:/state            # chat id and farmer feedback (feedback.jsonl)
    env_file: .env                    # needs TELEGRAM_TOKEN
    command: ["sh", "-c", "pip install --quiet 'paho-mqtt>=2.0' && python -u telegram_bot.py --host mosquitto --state /state/bot_state.json --feedback /state/feedback.jsonl"]

volumes:
  mosquitto-data:
  cloud-state:
